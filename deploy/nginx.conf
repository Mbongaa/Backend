# nginx config for the Bayaan kiosk dashboard.
#
# Serves the built React/Vite SPA and proxies /bayaan/api/* and /web/session/*
# to the Odoo backend so the dashboard's gateway can reach the API without
# CORS configuration.

upstream bayaan_odoo {
    server odoo:8069;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tighten cache for the SPA shell
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Long cache for fingerprinted assets
    location ~* \.(?:js|css|png|jpg|svg|woff2)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Bayaan API → Odoo
    location /bayaan/api/ {
        proxy_pass http://bayaan_odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Odoo session/login routes (frontend uses session cookie)
    location ~* ^/(web|odoo)/ {
        proxy_pass http://bayaan_odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
